<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 | 교육 운영 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-panel">
      <a class="brand" href="login.html"><span class="brand-mark"><img src="assets/images/K-HP 로고만.png" alt=""></span><span>교육 운영 관리</span></a>
      <h1>관리자 로그인</h1>
      <p>교육 신청부터 만족도 결과까지 한곳에서 관리하세요.</p>
      <div id="login-message" class="notice notice-error" role="alert" hidden></div>
      <form id="login-form" class="stack">
        <label class="field"><span>이메일 <b class="required">*</b></span><input type="email" name="email" autocomplete="email" placeholder="admin@example.com" required></label>
        <label class="field"><span>비밀번호 <b class="required">*</b></span><input type="password" name="password" autocomplete="current-password" minlength="6" placeholder="6자 이상 입력" required></label>
        <div class="login-actions"><button id="login-submit" class="button" type="submit">로그인</button></div>
      </form>
    </section>
    <aside class="login-visual" aria-label="제주한라대학교 건물 이미지">
      <img class="login-visual-image" src="assets/images/학교그림_배경삭제.png" alt="제주한라대학교 건물">
    </aside>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
