<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 | 교육 운영 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-panel">
      <a class="brand" href="login.html"><span class="brand-mark"><img src="assets/images/K-HP 로고만.png" alt=""></span><span>교육 운영 관리</span></a>
      <h1>관리자 로그인</h1>
      <p>교육 신청부터 만족도 결과까지 한곳에서 관리하세요.</p>
      <div id="login-message" class="notice notice-error" role="alert" hidden></div>
      <form id="login-form" class="stack" novalidate>
        <label class="field"><span>아이디 또는 이메일 <b class="required">*</b></span><input type="text" name="account" autocomplete="username" placeholder="admin@example.com" required></label>
        <label class="field"><span>비밀번호 <b class="required">*</b></span><input type="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required></label>
        <button class="button" type="submit">로그인</button>
      </form>
      <p class="helper" style="margin-top:18px">첫 번째 버전은 실제 인증 없이 관리자 화면으로 이동합니다.</p>
    </section>
    <aside class="login-visual" aria-label="서비스 주요 기능 소개">
      <div class="visual-content">
        <h2>흩어진 교육 운영 업무를<br>하나의 흐름으로 연결합니다.</h2>
        <p>교육 생성, 신청자, 연락, 출석, 만족도까지 교육 단위로 이어서 관리합니다.</p>
        <div class="visual-cards">
          <div class="visual-card"><strong>신청자 관리</strong><span>정상·마감 후·취소 상태를 한눈에</span></div>
          <div class="visual-card"><strong>연락 및 출석</strong><span>수강생별 상태를 빠르게 변경</span></div>
          <div class="visual-card"><strong>만족도 조사</strong><span>응답 현황과 미응답자를 함께 확인</span></div>
          <div class="visual-card"><strong>결과 조회</strong><span>평균 점수와 사람별 상세 답변 제공</span></div>
        </div>
      </div>
    </aside>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
