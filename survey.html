<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>만족도 조사 | 교육 운영 관리</title><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="survey">
  <main class="public-shell">
    <a class="brand public-brand" href="login.html"><span class="brand-mark"><img src="assets/images/K-HP 로고만.png" alt=""></span><span>교육 운영 관리</span></a>
    <section class="public-card">
      <h1 id="survey-course-title" class="public-title">만족도 조사</h1><p class="public-subtitle">교육에 참여해 주셔서 감사합니다. 응답은 최초 1회만 가능합니다.</p>
      <div id="survey-message" role="alert" hidden></div>
      <form id="survey-form" class="stack">
        <label class="field"><span>이름 <b class="required">*</b></span><input name="name" required autocomplete="name" placeholder="교육 신청 시 입력한 이름"></label>
        <div id="survey-question-list" class="stack"></div>
        <button class="button" type="submit">만족도 조사 제출</button>
      </form>
    </section>
  </main>
  <script src="js/mock-data.js"></script><script src="js/app.js"></script>
</body>
</html>
