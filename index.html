<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교육 관리 | 교육 운영 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/images/K-HP 로고만.png" alt=""></span><span>교육 운영 관리</span></a>
    <nav class="site-nav" aria-label="관리자 메뉴"><a class="active" href="index.html">교육 관리</a><a href="survey-settings.html">만족도 문항 설정</a><a href="login.html" data-logout hidden>로그아웃</a></nav>
  </header>
  <main class="page-shell">
    <div class="page-heading">
      <div><h1>교육 관리</h1><p>전체 교육과 현재 운영 현황을 확인합니다.</p></div>
      <div class="heading-actions"><a class="button" href="education-form.html">새 교육 생성</a></div>
    </div>
    <div id="dashboard-message" role="status" hidden></div>
    <section class="card" aria-labelledby="course-list-title">
      <div class="card-header">
        <div><h2 id="course-list-title">교육 목록</h2><p>교육명을 누르면 상세 운영 화면으로 이동합니다.</p></div>
        <div class="toolbar">
          <label class="search-box"><span class="sr-only" hidden>교육명 검색</span><input id="course-search" type="search" placeholder="교육명 검색" autocomplete="off"></label>
          <button id="delete-selected-courses" class="button button-danger" type="button" disabled>선택 삭제</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="selection-cell"><input id="select-all-courses" class="table-select" type="checkbox" aria-label="현재 교육 목록 전체 선택"></th><th>교육명</th><th>일자</th><th>시간</th><th>강사명</th><th>장소</th><th>정원</th><th>신청</th><th>초과</th><th>출석</th><th>만족도 응답</th><th>교육 상태</th></tr></thead>
          <tbody id="course-list"></tbody>
        </table>
      </div>
    </section>
    <section class="partner-logos" aria-label="협력 기관">
      <div class="partner-logo"><img src="assets/images/고용노동부_국_좌우.jpg" alt="고용노동부"></div>
      <div class="partner-logo"><img src="assets/images/한국산업인력공단 CI(국문).png" alt="한국산업인력공단"></div>
      <div class="partner-logo"><img src="assets/images/K-HP 로고(한글-기본).png" alt="K-하이테크 플랫폼"></div>
      <div class="partner-logo"><img src="assets/images/[로고] 제주한라대학교.jpg" alt="제주한라대학교"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script>
  <script src="js/mock-data.js"></script><script src="js/app.js"></script>
</body>
</html>
