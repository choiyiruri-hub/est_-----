<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>만족도 문항 설정 | 교육 운영 관리</title><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="survey-settings">
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><img src="assets/images/K-HP 로고만.png" alt=""></span><span>교육 운영 관리</span></a><nav class="site-nav"><a href="index.html">교육 관리</a><a class="active" href="survey-settings.html">만족도 문항 설정</a><a href="login.html">로그아웃</a></nav></header>
  <main class="page-shell narrow">
    <div class="page-heading"><div><h1>만족도 문항 설정</h1><p>이후 새로 생성하는 교육에 적용할 공통 문항을 관리합니다.</p></div><button id="add-question" class="button">문항 추가</button></div>
    <div class="notice notice-info">변경된 문항은 저장 이후 새로 생성하는 교육부터 적용됩니다. 이미 생성된 교육의 만족도 문항은 변경되지 않습니다.</div>
    <div id="settings-message" role="status" hidden></div>
    <section class="card"><div class="card-header"><div><h2>공통 문항 목록</h2><p>위로·아래로 버튼을 이용해 표시 순서를 바꿀 수 있습니다.</p></div></div><ol id="settings-list" class="question-list"></ol><div class="form-actions"><a class="button button-ghost" href="index.html">취소</a><button id="save-questions" class="button" type="button">변경사항 저장</button></div></section>
  </main>
  <dialog id="question-dialog"><form id="question-form" class="dialog-content"><h2 id="question-dialog-title">문항 추가</h2><input type="hidden" name="index"><div class="stack"><label class="field"><span>문항 유형</span><select name="type"><option value="score">점수형 (1~5점)</option><option value="text">주관식</option></select></label><label class="field"><span>문항 내용</span><textarea name="text" rows="4" required placeholder="질문을 입력해 주세요."></textarea></label></div><div class="form-actions"><button id="question-cancel" class="button button-ghost" type="button">취소</button><button class="button" type="submit">확인</button></div></form></dialog>
  <script src="js/mock-data.js"></script><script src="js/app.js"></script>
</body>
</html>
